[project]
name = "unstuck-api"
version = "0.1.0"
description = "Unstuck accessibility screening API (screening, not certification)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "anthropic>=2.8.0",
    "google-genai>=3.3.0",
    "pillow>=13.0.0",
    "deepagents>=0.7.38",
    "langchain-anthropic>=1.7.10",
    "langchain-google-genai>=4.5.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
